name: ReproCase

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Composite action: clean scan → green ────────────────────────────────
  scan-clean:
    name: "Clean site → green"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start server
        run: |
          node server.mjs site &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4173/ > /dev/null 2>&1 && break; sleep 0.5; done
      - name: ReproCase scan
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.6.0
        with:
          url: http://127.0.0.1:4173/
          fail-on: verified
          max-pages: 10

  # ─── Composite action: scanner error → exit 2 honest ────────────────────
  scanner-error:
    name: "Unreachable → exit 2 honest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan unreachable URL
        id: broken
        continue-on-error: true
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.6.0
        with:
          url: http://127.0.0.1:59999/
          fail-on: verified
          report-name: reprocase-report-honest
      - name: Assert honest failure
        run: |
          code="${{ steps.broken.outputs.exit-code }}"
          verdict="${{ steps.broken.outputs.verdict }}"
          if [ "$code" != "2" ] || [ "$verdict" != "error" ]; then
            echo "::error::Expected exit 2 + verdict=error but got $code/$verdict"
            exit 1
          fi
          echo "✅ Scanner exit 2 honest"

  # ─── Baseline gate: no new findings → pass ──────────────────────────────
  gate-no-new:
    name: "Same fault → gate passes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start server
        run: |
          node server.mjs site &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4173/ > /dev/null 2>&1 && break; sleep 0.5; done
      - name: Scan (fail-on never) + compare (fail-on new)
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.6.0
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          compare-with: baseline/result.json
          fail-on-new: 'true'
          max-pages: 10

  # ─── Composite action: ref = tag ─────────────────────────────────────────
  ref-tag:
    name: "reprocase-ref=v0.5.1 (tag)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start server
        run: |
          node server.mjs site &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4173/ > /dev/null 2>&1 && break; sleep 0.5; done
      - name: Scan with reprocase-ref=v0.5.1
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.6.0
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          reprocase-ref: 'v0.5.1'
          max-pages: 5

  # ─── Composite action: ref = SHA ─────────────────────────────────────────
  ref-sha:
    name: "reprocase-ref=SHA"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start server
        run: |
          node server.mjs site &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4173/ > /dev/null 2>&1 && break; sleep 0.5; done
      - name: Scan with reprocase-ref=SHA
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.6.0
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          reprocase-ref: '7e67bca3efd3cffcbac3e10bb624f7a4f3a00a7d'
          max-pages: 5

  # ─── Composite action: ref = invalid → error ────────────────────────────
  ref-invalid:
    name: "reprocase-ref=invalid → error"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan with invalid ref
        id: scan
        continue-on-error: true
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.6.0
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          reprocase-ref: 'nonexistent-ref-xyz-12345'
      - name: Assert clear error
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Expected failure for invalid ref"
            exit 1
          fi
          echo "✅ Invalid ref correctly rejected"

  # ─── Composite action: Job Summary generated ─────────────────────────────
  summary-check:
    name: "Job Summary generated"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start server
        run: |
          node server.mjs site &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4173/ > /dev/null 2>&1 && break; sleep 0.5; done
      - name: Scan
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.6.0
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          max-pages: 10
      - name: Verify summary
        run: |
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then
            CONTENT=$(cat "$GITHUB_STEP_SUMMARY")
            echo "Summary content (first 10 lines):"
            echo "$CONTENT" | head -10
            if echo "$CONTENT" | grep -q "ReproCase Scan Report"; then
              echo "✅ Job Summary generated correctly"
            else
              echo "::error::Summary missing expected header"
              exit 1
            fi
          else
            echo "::error::GITHUB_STEP_SUMMARY is empty"
            exit 1
          fi
