name: ReproCase

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start demo site
        run: |
          node server.mjs site &
          sleep 3
      - name: ReproCase scan
        id: reproscan
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.5.1
        with:
          url: http://127.0.0.1:4173/
          fail-on: verified
          max-pages: 10
      - name: Verdict
        if: always()
        run: echo "verdict=${{ steps.reproscan.outputs.verdict || 'n/a' }} (exit ${{ steps.reproscan.outputs.exit-code || 'n/a' }})"

  scanner-error-is-honest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ReproCase scan (unreachable target)
        id: broken
        continue-on-error: true
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@release/v0.5.0
        with:
          url: http://127.0.0.1:59999/
          fail-on: verified
          report-name: reprocase-report-honest
      - name: Assert honest failure
        run: |
          code="${{ steps.broken.outputs.exit-code }}"
          verdict="${{ steps.broken.outputs.verdict }}"
          echo "exit=$code verdict=$verdict"
          if [ "$code" != "2" ] || [ "$verdict" != "error" ]; then
            echo "::error::Scanner did not report the environment error honestly"
            exit 1
          fi
          echo "scanner-error honesty: OK"

  compare-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start demo site
        run: |
          node server.mjs site &
          sleep 3
      # Report-only scan; the NEW-findings gate is what fails this job.
      - name: ReproCase scan (report only)
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@release/v0.5.0
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          compare-with: baseline/result.json
          fail-on-new: true
          max-pages: 10

  fon-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inject fault
        run: bash setup-fault.sh
      - name: Start site
        run: |
          node server.mjs site &
          sleep 3
      - name: Scan (fail-on never + fail-on-new true)
        id: scan
        continue-on-error: true
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.5.1
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          compare-with: baseline/result.json
          fail-on-new: 'true'
          max-pages: 10
      - name: Assert gate fired
        run: |
          code="${{ steps.scan.outputs.exit-code }}"
          new="${{ steps.scan.outputs.new-findings }}"
          echo "exit=$code new=$new"
          if [ "$code" != "1" ]; then echo "::error::Expected exit 1"; exit 1; fi

  fon-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inject fault
        run: bash setup-fault.sh
      - name: Start site
        run: |
          node server.mjs site &
          sleep 3
      - name: Scan (fail-on never + fail-on-new false)
        id: scan
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.5.1
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          compare-with: baseline/result.json
          fail-on-new: 'false'
          max-pages: 10
      - name: Assert gate did not fire
        run: |
          code="${{ steps.scan.outputs.exit-code }}"
          if [ "$code" != "0" ]; then echo "::error::Expected exit 0"; exit 1; fi

  ref-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node start-and-wait.mjs
      - name: Scan (ref=v0.5.1 tag)
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.5.1
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          reprocase-ref: 'v0.5.1'
          max-pages: 5

  ref-sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node start-and-wait.mjs
      - name: Scan (ref=v0.5.1 commit SHA)
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.5.1
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          reprocase-ref: '7e67bca3efd3cffcbac3e10bb624f7a4f3a00a7d'
          max-pages: 5

  ref-invalid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan (ref=nonexistent)
        id: scan
        continue-on-error: true
        uses: geyutu6755/ReproCase/.github/actions/reprocase-scan@v0.5.1
        with:
          url: http://127.0.0.1:4173/
          fail-on: never
          reprocase-ref: 'nonexistent-ref-xyz-12345'
      - name: Assert error
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Expected failure"; exit 1
          fi
