<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integration Demo — Home</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f9; color: #1c2333; }
    header { background: #1c2333; color: #fff; padding: 12px 16px; }
    nav a { color: #b9c6ff; margin-right: 12px; }
    main { max-width: 680px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid #e2e6f0; border-radius: 10px; padding: 12px 16px; margin: 12px 0; }
    button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid #c3c9d9; background: #fff; }
  </style>
</head>
<body>
  <header>Integration Demo
    <nav><a href="./index.html">Home</a><a href="./about.html">About</a></nav>
  </header>
  <main>
    <h1>Home</h1>
    <div class="card"><p>Healthy page. The button toggles a status line — no faults.</p>
      <button id="status-btn" type="button">Show status</button>
      <p id="status-out" role="status"></p>
    </div>
    <nav><a href="./about.html">About page</a></nav>
  </main>
  <script>
    document.getElementById('status-btn').addEventListener('click', function () {
      document.getElementById('status-out').textContent = 'OK at ' + new Date().toISOString();
    });
  </script>
</body>
</html>
